name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: jaemnie
          
          # 깔끔한 테마 설정
          template: classic
          config_timezone: Asia/Seoul
          config_display: large
          config_padding: 5%
          
          # 다크 테마 색상 (streak-stats 스타일)
          config_order: base.header, isocalendar, languages, base.activity+community
          extras_css: |
            :root {
              --color-calendar-graph-day-bg: #161b22;
              --color-calendar-graph-day-L1-bg: #0e4429;
              --color-calendar-graph-day-L2-bg: #006d32;
              --color-calendar-graph-day-L3-bg: #26a641;
              --color-calendar-graph-day-L4-bg: #39d353;
            }
            body {
              background-color: #20232a !important;
              color: #ffffff !important;
            }
            svg {
              background-color: #20232a !important;
              font-family: 'Segoe UI', Ubuntu, sans-serif;
            }
            h1, h2, h3, .field {
              color: #58A6FF !important;
            }
            .subtitle, section.base .field .name {
              color: #8b949e !important;
            }
            .progress {
              background-color: #30363d !important;
            }
            .avatar {
              border-radius: 50% !important;
              border: 3px solid #58A6FF !important;
            }
            section {
              background-color: transparent !important;
            }
          
          # 기본 정보
          base: header, activity, community, repositories
          base_indepth: yes
          
          # Isocalendar (잔디 그래프)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          
          # 언어 통계
          plugin_languages: yes
          plugin_languages_details: percentage, bytes-size
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          plugin_languages_limit: 6
          plugin_languages_colors: github
          plugin_languages_threshold: 1%
